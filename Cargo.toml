[package]
name = "roboshpee"
version = "0.1.0"
edition = "2024"

[dependencies]
console-subscriber = "0.5.0"
poise = "0.6.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "tracing"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
opentelemetry = "0.32.0"
tracing-opentelemetry = "0.33.0" 
opentelemetry_sdk = { version = "0.32.1", features = ["experimental_async_runtime", "jaeger_remote_sampler", "rt-tokio", "tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["tokio"] }
opentelemetry-stdout = "0.32.0"
itertools = "0.15.0"
futures = "0.3.32"
songbird = { version = "0.6", features = ["serenity"] }
tracing-log = "0.2.0"
log = "0.4.33"

